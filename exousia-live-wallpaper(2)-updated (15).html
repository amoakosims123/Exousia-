<script id="exousia-live-immersive-mode">
(function(){
  const hidden=[];
  const restore=()=>{while(hidden.length){const item=hidden.pop();item.el.style.display=item.display;item.el.removeAttribute("data-live-immersive-hidden");}};
  const apply=()=>{
    restore();
    const live=document.getElementById("exousia-live-room");
    if(!live)return;
    const root=document.getElementById("root");
    if(root){root.style.height="100dvh";root.style.minHeight="100dvh";root.style.overflow="hidden";}
    let node=live;
    while(node&&node!==root){
      const parent=node.parentElement;
      if(!parent)break;
      [...parent.children].forEach(sibling=>{
        if(sibling!==node&&!sibling.contains(live)){hidden.push({el:sibling,display:sibling.style.display});sibling.style.display="none";sibling.setAttribute("data-live-immersive-hidden","true");}
      });
      node=parent;
    }
    live.style.display="flex";live.style.flexDirection="column";live.style.height="100dvh";live.style.minHeight="100dvh";live.style.maxHeight="100dvh";live.style.overflow="hidden";
  };
  let queued=false;const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;apply()})};
  new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener("resize",schedule,{passive:true});window.addEventListener("orientationchange",schedule,{passive:true});schedule();
})();
</script>

<script id="exousia-live-entry-card-script">
(function(){
  const CARD_ID="exousia-live-entry-card";
  let lastRoomId=null, checking=false;
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const initials=n=>String(n||"P").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()||"P";
  const openRoom=async()=>{
    try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch{}
    const live=[...document.querySelectorAll("#root button")].find(b=>/^(live|go live|listen live)$/i.test(b.textContent.trim())||/live/i.test(b.getAttribute("aria-label")||""));
    if(live){live.click();return;}
    let root=document.getElementById("exousia-live-room");
    if(!root){root=document.createElement("div");root.id="exousia-live-room";document.body.appendChild(root);}
  };
  const remove=()=>document.getElementById(CARD_ID)?.remove();
  const render=(room,host)=>{
    let card=document.getElementById(CARD_ID);
    if(!card){card=document.createElement("button");card.id=CARD_ID;card.type="button";card.setAttribute("aria-label","Open Pastor Tony live session");document.body.appendChild(card);}
    const name=host?.full_name||host?.username||"Pastor Tony";
    const avatar=host?.avatar_url?`<img src="${esc(host.avatar_url)}" alt="">`:esc(initials(name));
    card.innerHTML=`<span class="entry-avatar">${avatar}</span><span class="entry-copy"><strong>${esc(name)} is live</strong><small>${esc(room.title||"Exousia Live")} · Tap to join the live room</small><span class="entry-live"><i></i> LIVE NOW</span></span><span class="entry-arrow" aria-hidden="true">›</span>`;
    card.onclick=openRoom;
  };
  const check=async()=>{
    if(checking||document.getElementById("exousia-live-room"))return;
    checking=true;
    try{
      const c=await window.getExousiaSupabase();
      const {data,error}=await c.from("live_sessions").select("id,title,host_id,status").eq("status","live").order("started_at",{ascending:false}).limit(1).maybeSingle();
      if(error||!data){lastRoomId=null;remove();return;}
      if(data.id===lastRoomId&&document.getElementById(CARD_ID))return;
      lastRoomId=data.id;
      let host=null;
      if(data.host_id){const r=await c.from("profiles").select("full_name,username,avatar_url").eq("id",data.host_id).maybeSingle();host=r.data||null;}
      render(data,host);
    }catch{remove();}finally{checking=false;}
  };
  const scan=()=>{if(!document.getElementById("exousia-live-room"))check();else remove();};
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  window.addEventListener("load",check,{once:true});setTimeout(check,900);setInterval(scan,15000);
})();
</script>

<script id="exousia-live-phone-reference-tools">
(function(){
  const emojis=[
    ["😀","Grinning face"],["😃","Smiling face"],["😄","Smiling eyes"],["😁","Beaming face"],["😆","Squinting laugh"],["😂","Laughing with tears"],
    ["🤣","Rolling with laughter"],["😊","Smiling face"],["🙂","Slight smile"],["😉","Wink"],["😍","Heart eyes"],["🥰","Smiling with hearts"],
    ["😘","Kiss"],["😭","Crying"],["😢","Sad"],["😮","Surprised"],["😎","Cool"],["🥳","Celebration"],
    ["👏","Clapping"],["🙌","Praise hands"],["🙏","Prayer"],["👍","Thumbs up"],["👎","Thumbs down"],["💪","Strong"],
    ["🔥","Fire"],["❤️","Red heart"],["💜","Purple heart"],["💙","Blue heart"],["💚","Green heart"],["💛","Yellow heart"],
    ["🧡","Orange heart"],["💕","Two hearts"],["💖","Sparkling heart"],["💯","One hundred"],["✨","Sparkles"],["⭐","Star"],
    ["🎉","Party popper"],["🎊","Confetti ball"],["🙋","Raising hand"],["🤗","Hugging face"],["👀","Eyes"],["☝️","Pointing up"]
  ];
  const hook=()=>{
    const root=document.getElementById("exousia-live-room");if(!root)return;
    const photo=root.querySelector("#xlr-photo-tool"),emoji=root.querySelector("#xlr-emoji-tool"),input=root.querySelector("#xlr-message");
    if(photo&&!photo.dataset.bound){photo.dataset.bound="1";photo.onclick=()=>input?.focus();}
    if(!emoji||emoji.dataset.bound||!input)return;
    emoji.dataset.bound="1";emoji.setAttribute("aria-haspopup","dialog");emoji.setAttribute("aria-expanded","false");
    const panel=document.createElement("section");panel.className="xlr-emoji-picker";panel.hidden=true;panel.setAttribute("role","dialog");panel.setAttribute("aria-label","Choose an emoji");
    const heading=document.createElement("div");heading.className="xlr-emoji-picker-heading";
    const title=document.createElement("strong");title.textContent="Choose an emoji";
    const close=document.createElement("button");close.type="button";close.className="xlr-emoji-close";close.setAttribute("aria-label","Close emoji picker");close.textContent="×";
    heading.append(title,close);
    const grid=document.createElement("div");grid.className="xlr-emoji-grid";
    let caretStart=input.value.length,caretEnd=input.value.length;
    const saveCaret=()=>{if(typeof input.selectionStart==="number"){caretStart=input.selectionStart;caretEnd=input.selectionEnd??caretStart;}};
    ["input","keyup","click","select","focus"].forEach(type=>input.addEventListener(type,saveCaret));
    emojis.forEach(([character,label])=>{
      const choice=document.createElement("button");choice.type="button";choice.className="xlr-emoji-choice";choice.textContent=character;choice.setAttribute("aria-label",`Insert ${label}`);choice.title=label;
      choice.addEventListener("click",()=>{
        const start=Math.max(0,Math.min(caretStart,input.value.length));
        const end=Math.max(start,Math.min(caretEnd,input.value.length));
        const next=input.value.slice(0,start)+character+input.value.slice(end);
        if(input.maxLength>0&&next.length>input.maxLength)return;
        input.value=next;const nextCaret=start+character.length;
        input.dispatchEvent(new Event("input",{bubbles:true}));
        hidePicker();input.focus();input.setSelectionRange(nextCaret,nextCaret);caretStart=caretEnd=nextCaret;
      });
      grid.appendChild(choice);
    });
    panel.append(heading,grid);
    const room=root.querySelector(".xlr");if(!room)return;room.appendChild(panel);
    const hidePicker=()=>{panel.hidden=true;emoji.setAttribute("aria-expanded","false");};
    emoji.addEventListener("pointerdown",saveCaret);
    emoji.addEventListener("mousedown",saveCaret);
    emoji.onclick=()=>{saveCaret();panel.hidden=!panel.hidden;emoji.setAttribute("aria-expanded",String(!panel.hidden));if(!panel.hidden)panel.querySelector(".xlr-emoji-choice")?.focus();};
    close.onclick=()=>{hidePicker();emoji.focus();};
    panel.addEventListener("keydown",event=>{if(event.key==="Escape"){hidePicker();emoji.focus();}});
    root.addEventListener("pointerdown",event=>{if(!panel.hidden&&!panel.contains(event.target)&&event.target!==emoji&&!emoji.contains(event.target))hidePicker();});
  };
  new MutationObserver(hook).observe(document.documentElement,{childList:true,subtree:true});hook();
})();
</script>

<script id="exousia-live-requested-fixes-script">
(function(){
  'use strict';
  const MIC_ON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"></path></svg>';
  const MIC_OFF='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8M4 4l16 16"></path></svg>';
  const SHARE='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2"></circle><circle cx="6" cy="18" r="2"></circle><path d="m8 7 11 5-11 5M8 7l7-4M8 17l7 4"></path></svg>';
  const wallpaperUrl=(root,url)=>{const backdrop=root.querySelector('#xlr-backdrop');if(!backdrop||!url)return;const safe=String(url).replaceAll('"','%22');backdrop.style.setProperty('background-image',`linear-gradient(180deg,rgba(13,5,18,.3),rgba(12,5,16,.74)),url("${safe}")`,'important');backdrop.dataset.activeWallpaper=String(url);};
  const cleanupAfterEnd=()=>{const live=document.getElementById('exousia-live-room');if(live?.dataset.liveEnded==='1'){document.getElementById('exousia-background-live-player')?.remove();live.remove();if(document.fullscreenElement)document.exitFullscreen?.().catch?.(()=>{});}};
  const removePresenceNotice=node=>{
    const text=(node.textContent||'').replace(/\s+/g,' ').trim();
    const joined=/\b(has joined|joined the room|joined the audio room)\b/i.test(text);
    const left=/\b(has left|left the room|left the live)\b/i.test(text);
    if(joined){
      node.dataset.transientPresence='join';
      if(!node.dataset.presenceTimer)node.dataset.presenceTimer=setTimeout(()=>{node.remove();},5000);
    }else if(left){
      node.dataset.transientPresence='left';
      node.remove();
    }
  };
  const hook=root=>{
    if(!root||root.dataset.requestedFixes==='1'||!root.querySelector('#xlr-message'))return;
    root.dataset.requestedFixes='1';
    const share=root.querySelector('#xlr-share-bottom');
    if(share){share.setAttribute('aria-label','Share live room');const label=share.querySelector('.xlr-action-label');if(label)label.textContent='Share';const symbol=share.querySelector('.xlr-action-symbol');if(symbol&&symbol.innerHTML!==SHARE)symbol.innerHTML=SHARE;}
    const more=root.querySelector('#xlr-more-bottom');
    const updateMicIcons=()=>{
      const mic=root.querySelector('#xlr-mic'),caller=root.querySelector('#xlr-mic-toggle'),moreButton=root.querySelector('#xlr-more-bottom');
      const set=(button,muted)=>{if(!button)return;const state=muted?'off':'on';if(button.dataset.iconState!==state){const icon=button.querySelector('.xlr-control-icon');if(icon)icon.outerHTML=muted?MIC_OFF:MIC_ON;button.dataset.iconState=state;}const text=button.querySelector('.xlr-control-label');if(text){const next=muted?'Unmute microphone':'Mute microphone';if(text.textContent!==next)text.textContent=next;}};
      const micMuted=mic?.dataset.muted==='true'||/unmute/i.test(mic?.textContent||''),callerMuted=caller?.dataset.muted==='true'||/unmute/i.test(caller?.textContent||'');
      set(mic,micMuted);set(caller,callerMuted);
      if(moreButton){const muted=mic?micMuted:callerMuted,state=muted?'off':'on',symbol=moreButton.querySelector('.xlr-action-symbol');moreButton.setAttribute('aria-label','Microphone controls');if(symbol&&moreButton.dataset.iconState!==`more-${state}`){symbol.innerHTML=muted?MIC_OFF:MIC_ON;moreButton.dataset.iconState=`more-${state}`;}const label=moreButton.querySelector('.xlr-action-label');if(label&&label.textContent!=='Mic')label.textContent='Mic';}
    };
    if(more)more.addEventListener('click',()=>{const target=root.querySelector('#xlr-mic')||root.querySelector('#xlr-mic-toggle')||root.querySelector('#xlr-connect');target?.click();setTimeout(updateMicIcons,60);});
    updateMicIcons();
    new MutationObserver(updateMicIcons).observe(root,{subtree:true,childList:true,characterData:true});
    const feed=root.querySelector('#xlr-feed');if(feed){const scan=()=>[...feed.querySelectorAll('.xlr-notice')].forEach(removePresenceNotice);new MutationObserver(scan).observe(feed,{childList:true,subtree:true,characterData:true});scan();}
    const backdrop=root.querySelector('#xlr-backdrop');if(backdrop?.dataset.activeWallpaper)wallpaperUrl(root,backdrop.dataset.activeWallpaper);
    ['#xlr-wall-file','#xlr-prelive-wallpaper-file'].forEach(selector=>root.querySelector(selector)?.addEventListener('change',()=>setTimeout(()=>{const b=root.querySelector('#xlr-backdrop');if(b?.dataset.activeWallpaper)wallpaperUrl(root,b.dataset.activeWallpaper);},100)));
    root.querySelector('#xlr-end')?.addEventListener('click',()=>{setTimeout(cleanupAfterEnd,1800);setTimeout(cleanupAfterEnd,4000);});
    new MutationObserver(cleanupAfterEnd).observe(root,{attributes:true,attributeFilter:['data-live-ended']});
  };
  const scan=()=>{const root=document.getElementById('exousia-live-room');if(root)hook(root);};
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});scan();
})();
</script>

<script id="exousia-live-feed-behavior-final">
(function(){

    const nearBottom=()=>feed.scrollHeight-feed.scrollTop-feed.clientHeight<72;
    const settle=()=>{if(nearBottom())feed.dataset.manualScroll='0';};
    const inspect=()=>{
      [...feed.querySelectorAll('.xlr-notice')].forEach(node=>{
        const text=(node.textContent||'').replace(/\s+/g,' ').trim();
        if(/\b(call(?:-in)?|speaker|speak|microphone|audio)\b/i.test(text)&&!/host has muted/i.test(text)&&!node.dataset.audioExpiry){node.dataset.audioExpiry='1';setTimeout(()=>node.remove(),3000);}
      });
      settle();
    };
    feed.addEventListener('touchstart',()=>{feed.dataset.manualScroll='1';},{passive:true});
    feed.addEventListener('pointerdown',()=>{feed.dataset.manualScroll='1';},{passive:true});
    feed.addEventListener('wheel',()=>{feed.dataset.manualScroll='1';},{passive:true});
    feed.addEventListener('scroll',()=>{if(nearBottom())feed.dataset.manualScroll='0';},{passive:true});
    new MutationObserver(inspect).observe(feed,{childList:true,subtree:true,characterData:true});
    inspect();
  };
  const scan=()=>hook(document.getElementById('exousia-live-room'));
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();
</script>

const mountLive=async()=>{const r=q('#exousia-live-room');if(!r)return;const sid=r.dataset.sessionId;if(!sid||r.dataset.coinPanel)return;r.dataset.coinPanel='1';const p=document.createElement('section');p.className='exv-live-coins';p.innerHTML=`<div class="exv-live-head"><span>🪙 My coins</span><span class="exv-live-count" id="exv-live-count">0</span></div><div class="exv-gift-row"><button class="exv-gift-btn" data-g="flower">🌸 Flower · 10</button><button class="exv-gift-btn" data-g="fire">🔥 Fire · 10</button><button class="exv-gift-btn" data-g="bird">🐦 Bird · 10</button><button class="exv-gift-btn" data-g="heart">❤️ Heart · 10</button><button class="exv-gift-btn" data-g="clap">👏 Clap · 10</button><button class="exv-gift-btn" data-g="star">⭐ Star · 20</button><button class="exv-gift-btn" data-g="crown">👑 Crown · 20</button><button class="exv-gift-btn" data-g="rocket">🚀 Rocket · 50</button><button class="exv-gift-btn" data-g="car">🚗 Car · 50</button><button class="exv-gift-btn" data-g="trophy">🏆 Trophy · 100</button><button class="exv-gift-btn" data-g="diamond">💎 Diamond · 100</button><button class="exv-gift-btn" data-g="castle">🏰 Castle · 500</button><button class="exv-gift-btn" data-g="fireworks">🎆 Fireworks · 500</button></div>`;const feed=r.querySelector('#xlr-feed');if(feed)feed.before(p);else r.querySelector('.xlr')?.append(p);const refresh=async()=>{try{const d=await api({action:'balance'});p.querySelector('#exv-live-count').textContent=Number(d.coins?.coin_balance||0).toLocaleString()}catch{}};p.querySelectorAll('[data-g]').forEach(b=>b.onclick=async()=>{try{await api({action:'send_gift',session_id:sid,gift_code:b.dataset.g});refresh()}catch(e){alertBox(e.message)}});refresh();const c=await window.getExousiaSupabase();c.channel('coin-gifts-'+sid).on('postgres_changes',{event:'INSERT',schema:'public',table:'live_gift_events',filter:`session_id=eq.${sid}`},x=>window.exousiaShowLiveGift?window.exousiaShowLiveGift(x.new):alertBox(`${x.new.sender_name} sent ${x.new.emoji} ${x.new.gift_name}`)).subscribe()};
new MutationObserver(mountLive).observe(document.body,{childList:true,subtree:true});setTimeout(mountLive,900);
})();
</script>

<script data-exousia-live-gift-animation="2">
(()=>{
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.exousiaShowLiveGift=(gift)=>{
  if(!gift)return;const cost=Number(gift.coin_cost||0);const tier=cost>=500?'fireworks':cost>=100?'high':'';const name=esc(gift.sender_name||'A listener');const emoji=esc(gift.emoji||'🎁');const title=esc(gift.gift_name||'gift');
  const feed=document.querySelector('#exousia-live-room #xlr-feed');if(feed){const line=document.createElement('div');line.className='exv-gift-chat-line';line.setAttribute('role','status');line.innerHTML=`<span class="exv-chat-emoji">${emoji}</span><span><strong>${name}</strong> sent ${title}<small>${cost} coins</small></span>`;feed.appendChild(line);feed.scrollTop=feed.scrollHeight;}
  const old=document.querySelector('.exv-gift-overlay');old?.remove();const o=document.createElement('div');o.className=`exv-gift-overlay ${tier}`;o.innerHTML=`<div class="exv-gift-card"><i class="exv-spark s1">✨</i><i class="exv-spark s2">💫</i><i class="exv-spark s3">⭐</i><i class="exv-spark s4">✨</i><div class="exv-big-emoji">${emoji}</div><strong>${name}</strong><span>sent a ${title} · ${cost} coins</span></div>`;document.body.appendChild(o);setTimeout(()=>o.remove(),cost>=500?7000:4000);
 };

</script>

<script data-exousia-sermon-actions="1">
(()=>{

    actions.setAttribute('aria-label','Sermon community actions');
    actions.innerHTML='<button type="button" data-sermon-kind="testimony">Share testimony</button><button type="button" class="secondary" data-sermon-kind="inquiry">Ask a question</button>';
    box.parentElement.insertBefore(actions,box);
    actions.querySelectorAll('[data-sermon-kind]').forEach(button=>button.addEventListener('click',()=>{
      const select=box.querySelector('select[aria-label="Submission type"]');

      if(select){select.value=button.dataset.sermonKind;select.dispatchEvent(new Event('change',{bubbles:true}));}

<script data-exousia-create-account="1">
(()=>{
  const q=(s,r=document)=>r.querySelector(s);
  const close=()=>q('#exousia-create-account-modal')?.remove();
  window.exousiaOpenCreateAccount=()=>{
    close();const modal=document.createElement('div');modal.id='exousia-create-account-modal';modal.className='exousia-auth-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');
    modal.innerHTML='<section class="exousia-auth-card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Create your account</h2><button type="button" data-auth-close aria-label="Close" style="width:34px;height:34px;border:0;border-radius:50%;background:#eaf3ff;color:#1e4c9a;font-size:20px">×</button></div><p>Create a free Exousia account to enter live rooms, chat, keep your wallet balance, and send gifts.</p><form data-create-form><input name="name" autocomplete="name" placeholder="Full name" required><input name="email" type="email" autocomplete="email" placeholder="Email address" required><input name="password" type="password" autocomplete="new-password" placeholder="Password (at least 6 characters)" minlength="6" required><input name="confirm" type="password" autocomplete="new-password" placeholder="Confirm password" minlength="6" required><div class="exousia-auth-status" data-auth-status></div><button class="exousia-auth-submit" type="submit">Create account</button></form><button class="exousia-auth-back" type="button" data-auth-close>Back to sign in</button></section>';
    document.body.appendChild(modal);q('[data-auth-close]',modal).focus();
    modal.addEventListener('click',e=>{if(e.target===modal)close();});modal.querySelectorAll('[data-auth-close]').forEach(b=>b.addEventListener('click',close));
    q('[data-create-form]',modal).addEventListener('submit',async e=>{
      e.preventDefault();const form=e.currentTarget,data=new FormData(form),name=String(data.get('name')||'').trim(),email=String(data.get('email')||'').trim(),password=String(data.get('password')||''),confirm=String(data.get('confirm')||''),status=q('[data-auth-status]',modal),submit=q('.exousia-auth-submit',modal);
      if(password!==confirm){status.textContent='Passwords do not match.';return;}if(password.length<6){status.textContent='Password must be at least 6 characters.';return;}
      submit.disabled=true;submit.textContent='Creating account…';status.textContent='';
      try{const client=await window.getExousiaSupabase();const {data:result,error}=await client.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:window.location.href}});if(error)throw error;if(result?.session){status.style.color='#12864e';status.textContent='Account created. You are signed in.';setTimeout(close,900);}else{status.style.color='#12864e';status.textContent='Account created. Check your email to confirm, then sign in.';submit.textContent='Account created';}}catch(error){status.style.color='#b42318';status.textContent=error?.message||'Could not create the account.';submit.disabled=false;submit.textContent='Create account';}
    });
  };
  const mountLoginLink=()=>{const google=[...document.querySelectorAll('#root button')].find(b=>b.textContent.includes('Continue with Google'));if(!google||document.querySelector('.exousia-create-link'))return;const signIn=[...document.querySelectorAll('#root button')].find(b=>b.textContent.trim()==='Sign In');if(!signIn)return;const link=document.createElement('button');link.type='button';link.className='exousia-create-link';link.textContent='Create an account';link.onclick=window.exousiaOpenCreateAccount;signIn.insertAdjacentElement('afterend',link);};
  new MutationObserver(mountLoginLink).observe(document.body,{childList:true,subtree:true});window.addEventListener('load',()=>setTimeout(mountLoginLink,700));setTimeout(mountLoginLink,1000);
})();
</script>
